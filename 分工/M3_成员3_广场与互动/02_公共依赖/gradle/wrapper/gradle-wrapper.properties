# Gradle 发行版配置
#
# 为什么必须显式指定版本：
#   AGP 9.2.1 要求的最低 Gradle 版本正好是 9.4.1。
#   若交给 Android Studio 自动选择默认版本（如 9.3.0）会去下载官方分发包，
#   而 services.gradle.org 会 307 跳转到 GitHub，国内极易超时卡死；
#   即使下载成功，AGP 也会直接报「Minimum supported Gradle version is 9.4.1」而失败。
#
# 为什么用腾讯云镜像：
#   腾讯云镜像实测 43 MB/s，且与官方分发包逐字节一致（SHA-256 已校验，见下一行）。
#   海外环境可把 distributionUrl 换回官方地址：
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.4.1-bin.zip
distributionSha256Sum=2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
